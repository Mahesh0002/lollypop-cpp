    status: "implemented"
    title: "Shared accessible-name helper"
    files:
      - "frontend/include/util/accessibility.hpp"
      - "frontend/src/ui/components/AlbumCard.cpp"
      - "frontend/src/ui/components/AppleAlbumTile.cpp"
      - "frontend/src/ui/components/TrackRow.cpp"
      - "frontend/src/panels/pip_window.cpp"
      - "frontend/src/panels/right_now_playing.cpp"
    done_when: "Every custom focusable widget has tooltip and accessible name"
  - id: "P0-3"
    priority: "P0"
    status: "implemented"
    title: "Keyboard-visible album favourite"
    files:
      - "resources/apple_ui.css"
      - "frontend/src/ui/components/AppleAlbumTile.cpp"
    done_when: "Tab reveals favourite and Enter/Space toggles it"
  - id: "P0-4"
    priority: "P0"
    status: "implemented"
    title: "Canonical focus ring"
    files:
      - "resources/style.css"
      - "resources/apple_ui.css"
    done_when: "All focus-visible styles use --border-focus"
  - id: "P1-1"
    priority: "P1"
