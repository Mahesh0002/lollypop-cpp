version: 1
metadata:
  title: "Apple design philosophy extraction for Lollypop C++"
  generated: "2026-11-24"
  source_report: "docs/apple_design_philosophy_deep_dive.md"
  action_plan: "docs/APPLE_DESIGN_EXTRACTION_ACTION_PLAN.md"
  scope: "GTK4 music player; translate principles, do not imitate Apple surface"
  implementation_status: "P0-1..P0-4, P1-1..P1-4, and P2-1..P2-4 implemented; runtime GUI smoke remains manual"

principles:
  purpose:
    summary: "Make something meaningful"
    rules:
      - id: "PUR-1"
        rule: "Every panel has one obvious job"
        check: "Can the panel be described in one sentence?"
      - id: "PUR-2"
        rule: "Do not expose backend concepts as UI without need"
        check: "Are cache, provider, and index details hidden by default?"
      - id: "PUR-3"
        rule: "Optimize for listening and finding music"
        check: "Does this screen help the listener, or just look busy?"
  agency:
    summary: "Let people do things their own way"
    rules:
      - id: "AGE-1"
        rule: "No trapped flows or modes"
        check: "Does Escape or Back always provide an exit?"
      - id: "AGE-2"
        rule: "Search, browse, queue, and PiP are reachable without prerequisites"
        check: "Can a user reach tracks from more than one path?"
      - id: "AGE-3"
        rule: "Destructive actions are recoverable"
        check: "Can remove, clear, and reorder be undone or confirmed?"
  responsibility:
    summary: "Act in people's best interest"
    rules:
      - id: "RES-1"
        rule: "Explain non-local actions before they happen"
        check: "Are artwork fetches and external links discoverable?"
      - id: "RES-2"
        rule: "Collect no unnecessary data"
        check: "Is every data use tied to a stated user benefit?"
      - id: "RES-3"
        rule: "Degrade gracefully when permissions or network are unavailable"
        check: "Do fallback art and error states remain useful?"
  familiarity:
    summary: "Build on what people know"
    rules:
      - id: "FAM-1"
        rule: "Prefer GTK and Adwaita patterns before custom controls"
        check: "Do standard widgets keep standard behaviour?"
      - id: "FAM-2"
        rule: "Same action has same icon, label, and placement"
        check: "Do like, play, more, and back remain consistent?"
      - id: "FAM-3"
        rule: "Every action has visible feedback"
        check: "Do hover, pressed, selected, active, and loading states exist?"
  flexibility:
    summary: "Adapt to diverse contexts and needs"
    rules:
      - id: "FLE-1"
        rule: "Every focusable custom widget has an accessible name"
        check: "Does the widget expose both tooltip and accessible label?"
      - id: "FLE-2"
        rule: "Layout does not jump when async content arrives"
        check: "Do artwork and text have stable allocations?"
      - id: "FLE-3"
        rule: "Custom widgets support keyboard and pointer"
        check: "Is there default button behaviour or a key controller?"
      - id: "FLE-4"
        rule: "Use native GTK idiom"
        check: "Are there no fake macOS traffic lights or iOS tab bars?"
  simplicity:
    summary: "Be clear and direct"
    rules:
      - id: "SIM-1"
        rule: "One primary action per view"
        check: "Is the primary action visually dominant?"
      - id: "SIM-2"
        rule: "Use plain language"
        check: "Are tooltips and states free of implementation jargon?"
      - id: "SIM-3"
        rule: "Artwork and title lead; metadata recedes"
        check: "Is the hierarchy artwork/title > artist > secondary metadata?"
  craft:
    summary: "Care about every detail"
    rules:
      - id: "CRA-1"
        rule: "No clipped labels or raw colours outside tokens"
        check: "Does the design smoke flow show no clipping or raw hex?"
      - id: "CRA-2"
        rule: "Test with real library data"
        check: "Were long titles, missing art, and large queues tested?"
      - id: "CRA-3"
        rule: "Lifecycle correctness is part of craft"
        check: "Does the smoke flow produce no GTK criticals or assertions?"
  delight:
    summary: "Make it human without obstructing the task"
    rules:
      - id: "DEL-1"
        rule: "Emotion fits listening"
        check: "Is the motion/tone calm and music-first?"
      - id: "DEL-2"
        rule: "Defining moments support the task"
        check: "Do artwork reveal and PiP transition clarify state?"
      - id: "DEL-3"
        rule: "No gratuitous blur or animation"
        check: "Do reduced-motion and low-contrast modes still work?"

tokens:
  canonical:
    typography:
      - "--font-family"
      - "--font-display"
      - "--font-title1"
      - "--font-title2"
      - "--font-title3"
      - "--font-body"
      - "--font-subhead"
      - "--font-footnote"
      - "--font-caption1"
      - "--font-caption2"
    spacing:
      - "--space-1"
      - "--space-2"
      - "--space-3"
      - "--space-4"
      - "--space-6"
      - "--space-8"
    radius:
      - "--radius-xs"
      - "--radius-sm"
      - "--radius-md"
      - "--radius-lg"
    motion:
      - "--motion-fast"
      - "--motion-base"
      - "--motion-slow"
      - "--ease-out"
    focus:
      - "--border-focus"
  deprecated:
    - "resources/apple_ui.css --apple-size-*"
    - "hardcoded font-size pixels in Apple-specific component styles"
  consistency_checks:
    - "grep -R -- '--apple-size-' resources/ should return no matches"
    - "grep -R -- '--apple-font' resources/ should return no matches"
    - "grep -R 'font-size: [0-9]' resources/apple_ui.css should return no matches"
    - "all font sizes derive from --font-* and --font-scale"
    - "focus outlines use --border-focus"
    - "hover-only controls reveal on :focus-visible or :focus-within"
    - "transition and animation durations use --motion-* or the 1ms reduced-motion override"
    - "queue removals show an Undo control and restore the original index"
    - "visible favourite copy uses one spelling across menus, tooltips, and page titles"

components:
  AlbumCard:
    purpose: "Represent one album as a compact, selectable object"
    hierarchy: "artwork > title > artist"
    states:
      - "idle"
      - "hover"
      - "focus-visible"
      - "pressed"
      - "active"
      - "disabled"
    checks:
      - "focusable and key-activatable"
      - "accessible name includes album title"
      - "focus-visible styling is equivalent to hover"
  AppleAlbumTile:
    purpose: "Rich album tile for grid views"
    hierarchy: "artwork > scrim metadata > favourite action"
    states:
      - "idle"
      - "hover"
      - "focus-within"
      - "focus-visible"
      - "favorited"
      - "pressed"
    checks:
      - "favourite button visible on keyboard focus"
      - "favourite accessible name includes album title"
      - "scrim preserves artwork primacy"
  TrackRow:
    purpose: "Dense, scannable track list item"
    hierarchy: "number/artwork > title > artist > duration"
    states:
      - "idle"
      - "hover"
      - "focus-visible"
      - "playing"
      - "pressed"
      - "liked"
    checks:
      - "like button has tooltip and accessible name"
      - "no layout shift when like or equalizer appears"
      - "live-row registry cleanup remains intact"
  SidebarRows:
    purpose: "Structural navigation that defers to content"
    hierarchy: "icon + label, compact mode preserves recognition"
    states:
      - "idle"
      - "hover"
      - "active"
      - "focus-visible"
      - "compact"
    checks:
      - "click and keyboard activation both work"
      - "active label is semibold, inactive regular"
      - "focus ring matches canonical token"
  PiPWindow:
    purpose: "Persistent, glanceable playback state"
    hierarchy: "artwork > title > transport > progress > secondary controls"
    states:
      - "idle"
      - "focus-visible"
      - "dragging"
      - "playing"
      - "paused"
      - "loading"
    checks:
      - "close affordance is visible and accessible"
      - "undecorated resizable window has clear focus behaviour"
      - "does not grow into a second full player"
  QueueUndoBar:
    purpose: "Reverse the most recent queue removal"
    hierarchy: "message > Undo action"
    states:
      - "hidden"
      - "visible"
      - "undo available"
      - "stale"
      - "failed"
    checks:
      - "message names the removed track and outcome"
      - "Undo returns the track to its original index"
      - "stale bar closes instead of mutating a changed queue"
  StateComponents:
    purpose: "Explain empty, loading, and error conditions"
    files:
      - "frontend/src/ui/components/EmptyState.cpp"
      - "frontend/src/ui/components/LoadingState.cpp"
      - "frontend/src/ui/components/ErrorState.cpp"
    checks:
      - "empty state has explanation and primary action"
      - "error state says what failed and offers retry or dismiss"
      - "loading label is short and honest"

gap_register:
  - id: "G01"
    area: "tokens"
    observation: "Duplicate type scales exist"
    severity: "high"
    action: "Consolidate on --font-*"
  - id: "G02"
    area: "tokens"
    observation: "--font-scale only applies to the base scale"
    severity: "high"
    action: "Route Apple layer through scaled tokens"
  - id: "G03"
    area: "accessibility"
    observation: "Shared accessible-label helper is not present"
    severity: "high"
    action: "Create shared helper and apply broadly"
  - id: "G04"
    area: "accessibility"
    observation: "Favourite button is hidden unless hovered or favorited"
    severity: "high"
    action: "Reveal on focus-within and focus-visible"
  - id: "G05"
    area: "focus"
    observation: "Different focus-ring treatments across layers"
    severity: "medium"
    action: "Use one canonical focus token"
  - id: "G06"
    area: "motion"
    observation: "Global button animation disable is too broad"
    severity: "medium"
    action: "Scope it and add motion tokens"
  - id: "G07"
    area: "agency"
    observation: "No obvious undo pattern observed for queue mutations"
    severity: "medium"
    action: "Add undo or confirmation"
  - id: "G08"
    area: "craft"
    observation: "Hardcoded px values in Apple layer"
    severity: "medium"
    action: "Replace with tokens"
  - id: "G09"
    area: "PiP"
    observation: "Undecorated resizable window needs stronger focus and close contract"
    severity: "medium"
    action: "Document and verify"
  - id: "G10"
    area: "states"
    observation: "State-component usage consistency unknown"
    severity: "low"
    action: "Audit all pages"
  - id: "G11"
    area: "copy"
    observation: "Plain-language copy audit not performed"
    severity: "low"
    action: "Review user-visible strings"
  - id: "G12"
    area: "verification"
    observation: "No design-specific smoke checklist in repo"
    severity: "medium"
    action: "Add checklist to docs and CI"
    implementation_note: "Added docs/design_smoke_checklist.md and wired design_consistency_tests plus rtl_smoke_tests into CTest."

