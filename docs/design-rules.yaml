    implementation_note: "Matrix covers the section 4 components plus QueueList, QueueUndoBar, and state components. Queue empty copy now states the next user action."
  - id: "P1-2"
    priority: "P1"
    status: "implemented"
    title: "Forgiveness for queue actions"
    files:
      - "frontend/src/panels/right_now_playing.cpp"
      - "frontend/include/panels/right_now_playing.hpp"
      - "backend/include/queue_manager.hpp"
      - "backend/src/queue_manager.cpp"
      - "backend/include/controller.hpp"
      - "backend/src/controller.cpp"
      - "include/services/IPlayerService.hpp"
    done_when: "Visible destructive queue actions are undoable or confirmed"
    implementation_note: "Removing a queue track shows an Undo bar. Insertion at the original index uses a new QueueManager/BackendController API. Clear and reorder have no visible UI yet."
  - id: "P1-3"
    priority: "P1"
    status: "implemented"
    title: "Motion policy"
    files:
      - "resources/style.css"
      - "resources/apple_ui.css"
