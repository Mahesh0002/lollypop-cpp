    implementation_note: "Added --motion-fast/base/slow and --ease-out; button transitions now carry meaningful state feedback while animation remains disabled. Both reduced-motion paths collapse transitions and animations to 1ms."
  - id: "P1-4"
    priority: "P1"
    status: "implemented"
    title: "Copy audit"
    files:
      - "docs/copy_audit.md"
      - "frontend/src/panels/right_now_playing.cpp"
      - "frontend/src/ui/components/AlbumCard.cpp"
      - "frontend/src/ui/components/AppleAlbumTile.cpp"
    done_when: "No user-visible implementation jargon remains"
    implementation_note: "No implementation jargon found in UI strings. Queue empty copy was made actionable, Undo copy was added, and favourite menu spelling was unified."
  - id: "P2-1"
    priority: "P2"
    status: "implemented"
    title: "Runtime token generation"
    files:
      - "include/ui/theme/design_tokens.hpp"
      - "frontend/src/ui/theme/ThemeManager.cpp"
      - "resources/style.css"
      - "scripts/check_design_consistency.sh"
    done_when: "ThemeManager emits the canonical CSS token block"
    implementation_note: "build_css() is the single C++ source for font, motion, focus, accent, and on-accent text tokens. ThemeManager loads it through the high-priority provider and check_design_consistency.sh verifies it against :root defaults."
  - id: "P2-2"
    priority: "P2"
    status: "implemented"
    title: "Layout stress harness"
    files:
      - "tests/test_layout_stress.cpp"
      - "tests/CMakeLists.txt"
      - "docs/design_smoke_checklist.md"
    done_when: "100, 150, and 200 percent text scale are verified"
    implementation_note: "Headless harness generates 1000 long-named tracks with missing artwork and checks token output at 1.0, 1.5, and 2.0. Runtime screenshot verification is recorded in the manual smoke checklist."
  - id: "P2-3"
    priority: "P2"
    status: "implemented"
    title: "RTL smoke pass"
    files:
      - "resources/style.css"
      - "resources/apple_ui.css"
      - "scripts/rtl_smoke_check.sh"
    done_when: "Sidebar, tiles, rows, PiP, and progress rows are verified"
    implementation_note: "Physical separators and margins are scoped to :dir(ltr) and mirrored in :dir(rtl). rtl_smoke_check.sh asserts no unscoped physical edges and covers sidebar, tiles, rows, PiP labels, and progress rows."
  - id: "P2-4"
    priority: "P2"
    status: "implemented"
    title: "Design smoke checklist"
    files:
      - "docs/design_smoke_checklist.md"
      - "scripts/check_design_consistency.sh"
      - "scripts/rtl_smoke_check.sh"
      - "tests/CMakeLists.txt"
    done_when: "Token, focus, and accessibility greps are documented or automated"
    implementation_note: "CTest runs token/focus/accessibility and RTL greps headlessly; docs/design_smoke_checklist.md records the remaining desktop-only checks for text scale, focus, reduced motion, long titles, missing artwork, and queue Undo."

anti_patterns:
  - "minimal but obscure"
  - "glass but illegible"
  - "consistent but soulless"
  - "delightful but obstructive"
  - "accessible only after shipping"
  - "polished screenshot, broken lifecycle"
  - "Apple-shaped UI on Linux"

acceptance_metrics:
  duplicate_font_token_families: 0
  raw_hex_outside_token_definitions: 0
  focusable_custom_widgets_without_accessible_names: 0
  focusable_custom_widgets_without_focus_visible: 0
  gtk_criticals_in_smoke_flow: 0
  components_with_state_matrix: "100%"
  hover_only_controls: 0
  # Theme plan §11 (verified by scripts/check_theme_contrast.py)
  raw_rgba_outside_token_definitions: 0
  contrast_failures_body_text: 0
  hardcoded_accent_in_canvas_widgets: 0
  accent_tokens_emitted: 9
  schemes_verified: 2
  undefined_css_variables: 0
